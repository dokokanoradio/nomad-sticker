name: mainリポジトリへのプルリク時チェック

on:
  pull_request:
    branches:
      - main #mainへのコミット時に発動
    types:
      - opened #PRオープン時に発動
      - synchronize #PR内で追加コミット時に発動
      - reopened #PR再オープン時に発動

jobs:
  npm-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: npm updateの実行
        uses: $/.github/workflows/onwc_npm-update.yml

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: astroのチェック処理の実行
        uses: $/.github/workflows/onwc_astro-check.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: astroのビルド処理の実行
        uses: $/.github/workflows/onwc_build.yml
