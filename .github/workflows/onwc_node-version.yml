name: node-versionの確認

on:
    workflow_call:

jobs:
  npm_update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: miseによる依存パッケージインストール
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: miseでインストールされるnodeのバージョンチェック
        run: node --version > .mise-node-version   

      - name: diff確認
        run: diff .node-version .mise-node-version   
